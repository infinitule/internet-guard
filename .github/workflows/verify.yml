name: Verify

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.12", "3.13", "3.14"]
    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6, resolved 2026-10-29
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6, resolved 2026-10-29
        with:
          python-version: ${{ matrix.python }}
      - name: Install locked runtime dependency
        run: python -m pip install --require-hashes --only-binary=:all: -r requirements.lock
      - name: Require the TLS test prerequisite
        run: openssl version
      - name: Run tests
        run: python -m unittest discover -s tests -v
      - name: Exercise local UDP and TCP
        run: python -m internet_guard demo
      - name: Validate example policies
        run: |
          python -m internet_guard check --policy examples/guard.toml
          python -m internet_guard check --policy examples/agent-allowlist.toml
      - name: Compile source
        run: python -m compileall -q internet_guard
